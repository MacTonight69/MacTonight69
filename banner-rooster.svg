<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="1000" height="260">
  <defs>
    <!-- Fondo degradado: noche oscura → rojo sangre → dorado -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D0D0D"/>
      <stop offset="50%" stop-color="#1A1A2E"/>
      <stop offset="100%" stop-color="#2B0A0A"/>
    </linearGradient>

    <!-- Gradiente para el texto principal -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="50%" stop-color="#FF4500"/>
      <stop offset="100%" stop-color="#8B0000"/>
    </linearGradient>

    <!-- Gradiente de la barra de energía -->
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B0000"/>
      <stop offset="50%" stop-color="#FF4500"/>
      <stop offset="100%" stop-color="#FFD700"/>
    </linearGradient>

    <!-- Brillo de fondo -->
    <radialGradient id="glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#8B0000" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0D0D0D" stop-opacity="0"/>
    </radialGradient>

    <!-- Patrón de plumas -->
    <pattern id="feathers" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M20 5 Q25 15 20 25 Q15 15 20 5 Z" fill="#8B0000" opacity="0.08"/>
    </pattern>
  </defs>

  <!-- Fondo -->
  <rect width="1000" height="260" fill="url(#bgGrad)"/>
  <rect width="1000" height="260" fill="url(#feathers)"/>
  <rect width="1000" height="260" fill="url(#glow)"/>

  <!-- Marco doble estilo palenque -->
  <rect x="8" y="8" width="984" height="244" fill="none" stroke="#FFD700" stroke-width="2" opacity="0.8"/>
  <rect x="16" y="16" width="968" height="228" fill="none" stroke="#8B0000" stroke-width="1.5" opacity="0.9"/>

  <!-- Esquinas tipo HUD -->
  <path d="M8 40 L8 8 L40 8" fill="none" stroke="#FF4500" stroke-width="3"/>
  <path d="M960 8 L992 8 L992 40" fill="none" stroke="#FF4500" stroke-width="3"/>
  <path d="M8 220 L8 252 L40 252" fill="none" stroke="#FF4500" stroke-width="3"/>
  <path d="M960 252 L992 252 L992 220" fill="none" stroke="#FF4500" stroke-width="3"/>

  <!-- ===== CUERVO (izquierda) ===== -->
  <g transform="translate(70, 60)">
    <!-- Cuerpo del cuervo (silueta estilizada) -->
    <path d="M20 100 Q10 60 30 30 Q45 10 70 15 Q90 20 95 45 
             Q100 70 80 95 Q60 115 40 110 Z" 
          fill="#0D0D0D" stroke="#4A4A6A" stroke-width="2"/>
    <!-- Cabeza -->
    <circle cx="60" cy="30" r="18" fill="#0D0D0D" stroke="#4A4A6A" stroke-width="2"/>
    <!-- Pico -->
    <path d="M78 28 L98 32 L78 38 Z" fill="#FFD700" stroke="#8B0000" stroke-width="1"/>
    <!-- Ojo brillante animado -->
    <circle cx="68" cy="27" r="3.5" fill="#FF0000">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="68" cy="27" r="1.5" fill="#FFD700"/>
    <!-- Ala extendida -->
    <path d="M35 50 Q0 40 -10 65 Q10 70 30 75 Z" fill="#1A1A2E" stroke="#4A4A6A" stroke-width="1.5"/>
    <!-- Cola -->
    <path d="M40 105 L10 130 L25 128 L15 145 L45 118 Z" fill="#0D0D0D" stroke="#4A4A6A" stroke-width="1.5"/>
    <!-- Patas -->
    <line x1="50" y1="108" x2="45" y2="130" stroke="#FFD700" stroke-width="2"/>
    <line x1="60" y1="108" x2="65" y2="130" stroke="#FFD700" stroke-width="2"/>
  </g>

  <!-- Texto "CUERVO" -->
  <text x="130" y="220" font-family="Impact, Arial Black, sans-serif" font-size="22" 
        fill="#4A4A6A" text-anchor="middle" letter-spacing="4">CUERVO</text>

  <!-- ===== GALLO (derecha) ===== -->
  <g transform="translate(810, 55)">
    <!-- Cresta animada -->
    <path d="M40 20 Q30 0 40 -5 Q50 5 55 -5 Q65 0 60 20 Z" fill="#FF0000">
      <animate attributeName="d" 
        values="M40 20 Q30 0 40 -5 Q50 5 55 -5 Q65 0 60 20 Z;
                M40 20 Q28 -2 40 -8 Q52 3 58 -6 Q68 -1 60 20 Z;
                M40 20 Q30 0 40 -5 Q50 5 55 -5 Q65 0 60 20 Z" 
        dur="1.5s" repeatCount="indefinite"/>
    </path>
    <!-- Cabeza -->
    <circle cx="50" cy="35" r="18" fill="#8B0000" stroke="#FFD700" stroke-width="2"/>
    <!-- Pico -->
    <path d="M66 33 L90 38 L66 43 Z" fill="#FFD700" stroke="#8B0000" stroke-width="1"/>
    <!-- Ojo brillante animado -->
    <circle cx="56" cy="32" r="3.5" fill="#FFD700">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="56" cy="32" r="1.5" fill="#FF0000"/>
    <!-- Barbilla (wattle) -->
    <ellipse cx="60" cy="52" rx="6" ry="9" fill="#FF0000">
      <animate attributeName="ry" values="9;11;9" dur="1.2s" repeatCount="indefinite"/>
    </ellipse>
    <!-- Cuerpo -->
    <path d="M20 100 Q5 60 30 40 Q50 35 70 45 Q90 60 85 100 Q60 115 35 110 Z" 
          fill="#8B0000" stroke="#FFD700" stroke-width="2"/>
    <!-- Plumas del cuello -->
    <path d="M30 60 Q15 55 10 75 Q25 80 35 75 Z" fill="#FF4500" opacity="0.8"/>
    <path d="M70 55 Q85 50 90 70 Q75 78 65 72 Z" fill="#FF4500" opacity="0.8"/>
    <!-- Cola de plumas -->
    <path d="M30 105 Q0 100 -15 120 Q5 125 10 135 Q30 125 40 115 Z" 
          fill="#1A0A0A" stroke="#FFD700" stroke-width="1.5"/>
    <path d="M35 105 Q5 95 -10 110 Q10 118 20 125 Q35 118 45 110 Z" 
          fill="#8B0000" stroke="#FF4500" stroke-width="1" opacity="0.9"/>
    <!-- Patas -->
    <line x1="45" y1="108" x2="40" y2="130" stroke="#FFD700" stroke-width="2"/>
    <line x1="60" y1="108" x2="65" y2="130" stroke="#FFD700" stroke-width="2"/>
    <!-- Espolones -->
    <path d="M40 130 L35 138 L42 134 Z" fill="#FFD700"/>
    <path d="M65 130 L70 138 L63 134 Z" fill="#FFD700"/>
  </g>

  <!-- Texto "GALLO" -->
  <text x="870" y="220" font-family="Impact, Arial Black, sans-serif" font-size="22" 
        fill="#FFD700" text-anchor="middle" letter-spacing="4">GALLO</text>

  <!-- ===== VS central ===== -->
  <text x="500" y="140" font-family="Impact, Arial Black, sans-serif" font-size="52" 
        fill="url(#textGrad)" text-anchor="middle" letter-spacing="2">
    VS
    <animate attributeName="opacity" values="1;0.6;1" dur="1.5s" repeatCount="indefinite"/>
  </text>

  <!-- Rayo entre ambos -->
  <path d="M470 130 L490 125 L480 135 L500 130 L485 145 L505 140" 
        fill="none" stroke="#FFD700" stroke-width="2" opacity="0.9">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="0.8s" repeatCount="indefinite"/>
  </path>

  <!-- ===== Texto tipo terminal ===== -->
  <text x="500" y="60" font-family="Courier New, monospace" font-size="16" 
        fill="#FFD700" text-anchor="middle" letter-spacing="2">
    &gt; INICIALIZANDO SISTEMA...
    <animate attributeName="opacity" values="1;0.2;1" dur="1s" repeatCount="indefinite"/>
  </text>

  <text x="500" y="85" font-family="Courier New, monospace" font-size="14" 
        fill="#FF4500" text-anchor="middle" letter-spacing="1">
    &gt; CARGANDO MÓDULOS DE COMBATE_
    <animate attributeName="opacity" values="1;0.4;1" dur="1.3s" repeatCount="indefinite"/>
  </text>

  <!-- Línea de escaneo (scanline) animada -->
  <rect x="0" y="0" width="1000" height="4" fill="#FFD700" opacity="0.15">
    <animate attributeName="y" values="0;256;0" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- ===== Barra de energía (abajo) ===== -->
  <text x="40" y="245" font-family="Courier New, monospace" font-size="12" 
        fill="#FFD700">HP</text>
  <rect x="65" y="235" width="200" height="10" fill="none" stroke="#FFD700" stroke-width="1.5"/>
  <rect x="67" y="237" width="0" height="6" fill="url(#barGrad)">
    <animate attributeName="width" values="0;196;196;0" dur="4s" repeatCount="indefinite"/>
  </rect>

  <text x="800" y="245" font-family="Courier New, monospace" font-size="12" 
        fill="#FFD700">EN</text>
  <rect x="825" y="235" width="130" height="10" fill="none" stroke="#FFD700" stroke-width="1.5"/>
  <rect x="827" y="237" width="0" height="6" fill="#FF4500">
    <animate attributeName="width" values="0;126;126;0" dur="4s" repeatCount="indefinite" begin="0.5s"/>
  </rect>
</svg>
