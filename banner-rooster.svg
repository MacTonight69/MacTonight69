<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420">
  <defs>
    <!-- Cielo infernal: negro → vino → brasa -->
    <radialGradient id="sky" cx="50%" cy="20%" r="90%">
      <stop offset="0%" stop-color="#2A0505"/>
      <stop offset="35%" stop-color="#150202"/>
      <stop offset="100%" stop-color="#050505"/>
    </radialGradient>

    <!-- Luna llena -->
    <radialGradient id="moon" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F5E6C8"/>
      <stop offset="70%" stop-color="#D4B896"/>
      <stop offset="100%" stop-color="#8B7355"/>
    </radialGradient>

    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F5E6C8" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#8B0000" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Gradiente del texto principal -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8D5A8"/>
      <stop offset="45%" stop-color="#C9A961"/>
      <stop offset="75%" stop-color="#8B0000"/>
      <stop offset="100%" stop-color="#3A0000"/>
    </linearGradient>

    <!-- Ornamento -->
    <linearGradient id="ornament" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3A0000" stop-opacity="0"/>
      <stop offset="50%" stop-color="#C9A961"/>
      <stop offset="100%" stop-color="#3A0000" stop-opacity="0"/>
    </linearGradient>

    <!-- Brillo suave -->
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Brillo más intenso para el texto central -->
    <filter id="strongGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Cuervo en vuelo -->
    <g id="ravenFlying">
      <path d="M0 0 Q-8 -6 -18 -4 Q-14 2 -20 4 Q-10 6 -6 4 Q-12 8 -18 12 Q-8 10 -2 8 Q-4 14 -2 18 Q0 12 2 18 Q4 14 2 8 Q8 10 18 12 Q12 8 6 4 Q10 6 20 4 Q14 2 18 -4 Q8 -6 0 0 Z" fill="#0A0A0A"/>
    </g>

    <!-- Cuervo posado -->
    <g id="ravenPerched">
      <path d="M0 0 Q-4 -10 2 -18 Q6 -22 10 -20 Q14 -18 14 -12 Q14 -4 8 2 Q4 6 0 0 Z" fill="#0A0A0A"/>
      <ellipse cx="10" cy="-20" rx="5" ry="4.5" fill="#0A0A0A"/>
      <path d="M14 -20 L20 -19 L14 -18 Z" fill="#1A1A1A"/>
      <circle cx="12" cy="-20.5" r="0.8" fill="#8B0000"/>
      <path d="M0 0 L-6 10 L-2 9 L-7 16 L2 8 L4 12 Z" fill="#0A0A0A"/>
      <line x1="6" y1="2" x2="6" y2="10" stroke="#1A1A1A" stroke-width="1"/>
      <line x1="10" y1="2" x2="10" y2="10" stroke="#1A1A1A" stroke-width="1"/>
    </g>
  </defs>

  <!-- Fondo -->
  <rect width="1200" height="420" fill="url(#sky)"/>

  <!-- Luna llena -->
  <circle cx="980" cy="100" r="80" fill="url(#moonGlow)"/>
  <circle cx="980" cy="100" r="48" fill="url(#moon)"/>
  <circle cx="962" cy="88" r="6" fill="#B8A080" opacity="0.4"/>
  <circle cx="992" cy="112" r="4" fill="#B8A080" opacity="0.35"/>
  <circle cx="975" cy="118" r="3" fill="#B8A080" opacity="0.3"/>

  <!-- Niebla inferior -->
  <ellipse cx="600" cy="400" rx="800" ry="70" fill="#0A0A0A" opacity="0.92"/>
  <ellipse cx="300" cy="410" rx="450" ry="45" fill="#1A0A0A" opacity="0.6"/>
  <ellipse cx="900" cy="415" rx="400" ry="40" fill="#1A0A0A" opacity="0.5"/>

  <!-- Rama muerta -->
  <path d="M0 300 Q150 280 300 295 Q450 310 600 290 Q750 275 900 295 Q1050 315 1200 300" 
        fill="none" stroke="#0A0A0A" stroke-width="3"/>
  <path d="M0 302 Q150 282 300 297 Q450 312 600 292 Q750 277 900 297 Q1050 317 1200 302" 
        fill="none" stroke="#1A0A0A" stroke-width="1"/>
  <path d="M180 288 Q200 260 220 250" fill="none" stroke="#0A0A0A" stroke-width="2"/>
  <path d="M420 302 Q440 275 460 265" fill="none" stroke="#0A0A0A" stroke-width="2"/>
  <path d="M780 290 Q800 265 820 255" fill="none" stroke="#0A0A0A" stroke-width="2"/>
  <path d="M1020 308 Q1040 280 1060 270" fill="none" stroke="#0A0A0A" stroke-width="2"/>

  <!-- Cuervos posados -->
  <use href="#ravenPerched" x="200" y="260" transform="scale(1.1)"/>
  <use href="#ravenPerched" x="440" y="272" transform="scale(1.2)"/>
  <use href="#ravenPerched" x="800" y="260" transform="scale(1.1)"/>
  <use href="#ravenPerched" x="1040" y="278" transform="scale(1.0)"/>

  <!-- Cuervos volando -->
  <use href="#ravenFlying" x="120" y="80" transform="scale(1.5)" opacity="0.85"/>
  <use href="#ravenFlying" x="300" y="50" transform="scale(1.1)" opacity="0.6"/>
  <use href="#ravenFlying" x="520" y="70" transform="scale(1.3)" opacity="0.7"/>
  <use href="#ravenFlying" x="720" y="40" transform="scale(0.9)" opacity="0.5"/>
  <use href="#ravenFlying" x="1100" y="180" transform="scale(1.2)" opacity="0.7"/>

  <!-- Marco ornamental doble -->
  <rect x="14" y="14" width="1172" height="392" fill="none" stroke="#3A0000" stroke-width="1" opacity="0.9"/>
  <rect x="20" y="20" width="1160" height="380" fill="none" stroke="#6B0000" stroke-width="1" opacity="0.6"/>
  <rect x="26" y="26" width="1148" height="368" fill="none" stroke="#C9A961" stroke-width="0.5" opacity="0.35"/>

  <!-- Esquinas ornamentales -->
  <g stroke="#C9A961" stroke-width="1.2" fill="none" opacity="0.85">
    <path d="M14 56 L14 14 L56 14"/>
    <path d="M20 62 L20 20 L62 20" opacity="0.5"/>
    <circle cx="22" cy="22" r="2" fill="#C9A961" stroke="none"/>

    <path d="M1144 14 L1186 14 L1186 56"/>
    <path d="M1138 20 L1180 20 L1180 62" opacity="0.5"/>
    <circle cx="1178" cy="22" r="2" fill="#C9A961" stroke="none"/>

    <path d="M14 364 L14 406 L56 406"/>
    <path d="M20 358 L20 400 L62 400" opacity="0.5"/>
    <circle cx="22" cy="398" r="2" fill="#C9A961" stroke="none"/>

    <path d="M1144 406 L1186 406 L1186 364"/>
    <path d="M1138 400 L1180 400 L1180 358" opacity="0.5"/>
    <circle cx="1178" cy="398" r="2" fill="#C9A961" stroke="none"/>
  </g>

  <!-- ============ TEXTO CENTRAL: LA PUERTA DEL INFIERNO ============ -->

  <!-- Línea superior ornamental -->
  <line x1="100" y1="72" x2="1100" y2="72" stroke="url(#ornament)" stroke-width="1"/>
  <path d="M600 66 L606 72 L600 78 L594 72 Z" fill="#C9A961" opacity="0.85"/>

  <!-- Texto principal en italiano (la frase icónica) -->
  <text x="600" y="130" 
        font-family="'Cinzel', 'Trajan Pro', 'Times New Roman', serif" 
        font-size="34" font-weight="600" 
        fill="url(#textGrad)" text-anchor="middle" 
        letter-spacing="8" filter="url(#strongGlow)">
    LASCIATE OGNE SPERANZA
  </text>

  <text x="600" y="180" 
        font-family="'Cinzel', 'Trajan Pro', 'Times New Roman', serif" 
        font-size="34" font-weight="600" 
        fill="url(#textGrad)" text-anchor="middle" 
        letter-spacing="8" filter="url(#strongGlow)">
    VOI CH'INTRATE
  </text>

  <!-- Línea ornamental media -->
  <line x1="380" y1="205" x2="820" y2="205" stroke="url(#ornament)" stroke-width="0.8"/>
  <path d="M600 200 L605 205 L600 210 L595 205 Z" fill="#C9A961" opacity="0.7"/>

  <!-- Texto secundario: primeras tres líneas del Canto III -->
  <text x="600" y="235" 
        font-family="'EB Garamond', 'Georgia', serif" 
        font-size="13" font-style="italic"
        fill="#C9A961" text-anchor="middle" 
        letter-spacing="2" opacity="0.85">
    «Per me si va ne la città dolente,
  </text>

  <text x="600" y="256" 
        font-family="'EB Garamond', 'Georgia', serif" 
        font-size="13" font-style="italic"
        fill="#C9A961" text-anchor="middle" 
        letter-spacing="2" opacity="0.85">
    per me si va ne l'etterno dolore,
  </text>

  <text x="600" y="277" 
        font-family="'EB Garamond', 'Georgia', serif" 
        font-size="13" font-style="italic"
        fill="#C9A961" text-anchor="middle" 
        letter-spacing="2" opacity="0.85">
    per me si va tra la perduta gente.»
  </text>

  <!-- Atribución -->
  <text x="600" y="300" 
        font-family="'EB Garamond', 'Georgia', serif" 
        font-size="11"
        fill="#8B7355" text-anchor="middle" 
        letter-spacing="4" opacity="0.7">
    — DANTE ALIGHIERI · INFERNO · CANTO III
  </text>

  <!-- Línea ornamental inferior -->
  <line x1="100" y1="322" x2="1100" y2="322" stroke="url(#ornament)" stroke-width="1"/>
  <path d="M600 316 L606 322 L600 328 L594 322 Z" fill="#C9A961" opacity="0.85"/>

  <!-- Velas parpadeantes en las esquinas -->
  <g transform="translate(70, 350)">
    <rect x="-3" y="0" width="6" height="22" fill="#1A1A1A"/>
    <ellipse cx="0" cy="-3" rx="3" ry="6" fill="#C9A961" opacity="0.9">
      <animate attributeName="ry" values="6;7;5;6" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0.6;1;0.9" dur="1.5s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="0" cy="-2" rx="1.5" ry="3" fill="#F5E6C8">
      <animate attributeName="opacity" values="1;0.7;1" dur="1s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <g transform="translate(1130, 350)">
    <rect x="-3" y="0" width="6" height="22" fill="#1A1A1A"/>
    <ellipse cx="0" cy="-3" rx="3" ry="6" fill="#C9A961" opacity="0.9">
      <animate attributeName="ry" values="5;6;5;7" dur="2.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;1;0.7;0.9" dur="1.8s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="0" cy="-2" rx="1.5" ry="3" fill="#F5E6C8">
      <animate attributeName="opacity" values="0.9;1;0.8" dur="1.2s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- Scanline sutil de fondo -->
  <rect x="0" y="0" width="1200" height="2" fill="#C9A961" opacity="0.06">
    <animate attributeName="y" values="0;418;0" dur="8s" repeatCount="indefinite"/>
  </rect>
</svg>
